    <style>
        .part-btn {
            background: #fff;
            border: 1px solid #ddd;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 500;
            color: #555;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            font-size: 14px;
            display: inline-flex;
            align-items: center;
            white-space: nowrap;
        }

        .part-btn:hover {
            background: #f3f4f6;
            color: #0d6efd;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
        }

        .part-btn.active {
            background: #0d6efd;
            color: #fff;
            border-color: #0d6efd;
            box-shadow: 0 4px 12px rgba(13, 110, 253, 0.3);
        }

        .desktop-text {
            max-width: 0;
            opacity: 0;
            overflow: hidden;
            display: inline-block;
            transition: max-width 0.4s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s ease;
            vertical-align: middle;
        }

        .part-btn:hover .desktop-text,
        .part-btn.active .desktop-text {
            max-width: 300px;
            opacity: 1;
            margin-left: 4px;
        }

        .mobile-text {
            display: none;
        }

        /* Info Button Style */
        .info-btn {
            background: #fff;
            color: #8a2be2;
            /* BlueViolet */
            border: 1px solid #8a2be2;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .info-btn:hover {
            background: #8a2be2;
            color: white;
        }

        /* Modal Styles */
        .info-modal {
            display: none;
            position: fixed;
            z-index: 99999;
            padding-top: 50px;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgb(0, 0, 0);
            background-color: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(5px);
            text-align: center;
            /* Center content */
        }

        .modal-content {
            margin: auto;
            display: inline-block;
            /* Allow centering with text-align */
            max-width: 98vw;
            /* Maximize usage of screen */
            max-height: 98vh;
            width: auto;
            height: auto;
            object-fit: contain;
            border-radius: 4px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            animation-name: zoom;
            animation-duration: 0.4s;
            transition: width 0.3s ease;
            /* Smooth size transition */
            cursor: zoom-in;
        }

        /* Zoomed State - True Scrollable Zoom */
        .modal-content.zoomed {
            width: 150%;
            /* Force wider than screen to enable scrolling */
            max-width: none;
            max-height: none;
            margin: 0;
            cursor: grab;
            transform: none;
            /* Disable CSS transform to allow native scrolling */
        }

        .modal-content.zoomed:active {
            cursor: grabbing;
        }

        @keyframes zoom {
            from {
                transform: scale(0)
            }

            to {
                transform: scale(1)
            }
        }

        .close-modal {
            position: absolute;
            top: 20px;
            right: 35px;
            color: #f1f1f1;
            font-size: 40px;
            font-weight: bold;
            transition: 0.3s;
            cursor: pointer;
            z-index: 100000;
        }

        .close-modal:hover,
        .close-modal:focus {
            color: #bbb;
            text-decoration: none;
            cursor: pointer;
        }

        /* Mobile adjustments */
        @media only screen and (max-width: 700px) {
            .modal-content {
                width: 100%;
            }

            .info-btn .btn-text {
                display: none;
            }

            .desktop-icon,
            .desktop-text {
                display: none !important;
            }

            .mobile-text {
                display: inline;
                font-weight: bold;
            }

            .part-btn {
                padding: 8px;
                font-size: 16px;
                border-radius: 50%;
                width: 40px;
                height: 40px;
                display: inline-flex;
                justify-content: center;
                align-items: center;
            }

            .info-btn {
                border-radius: 20px;
                width: auto;
                padding: 8px 16px;
            }
        }

        #caption {
            margin: auto;
            display: block;
            width: 80%;
            text-align: center;
            color: #ccc;
            padding: 10px 0;
            height: 150px;
            font-size: 18px;
        }
    </style>
</head>

    <script>
        // Tab function
        function openTab(evt, tabName) {
            var i, tabcontent, tablinks;
            tabcontent = document.getElementsByClassName("tab-content");
            for (i = 0; i < tabcontent.length; i++) {
                tabcontent[i].style.display = "none";
                tabcontent[i].classList.remove('active');
            }
            tablinks = document.getElementsByClassName("tab-btn");
            for (i = 0; i < tablinks.length; i++) {
                tablinks[i].className = tablinks[i].className.replace(" active", "");
            }
            document.getElementById(tabName).style.display = "block";
            document.getElementById(tabName).classList.add('active');
            evt.currentTarget.className += " active";
        }

        // Config specific for Chapter 2
        const config = {
            parts: {
                1: 'Phần 1_Image_Point_Operations/index.html',
                2: 'Phần 2_Advanced_Histogram_Techniques/index.html',
                3: 'Phần 3_Optimized_Image_Enhancement/index.html',
                4: 'Phần 4_Convolution_and_Image_Smoothing/index.html',
                5: 'Phần 5_Edges_and_Image_Restoration/index.html',
                6: 'Phần 6_Image_Restoration_Lab/index.html'
            },
            quizCsv: '../Quiz/index.html?group=Chuong2'
        };

        let currentPartId = 1; // Track current part

        function loadPart(partId, btn) {
            currentPartId = partId; // Update current part

            // Update Active State
            if (btn) {
                document.querySelectorAll('.part-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
            }

            // Load Content
            const url = config.parts[partId];
            if (url) {
                document.getElementById('pdf-frame').src = url;
            } else {
                console.error("Part not found:", partId);
                alert("Nội dung bài học này chưa khả dụng.");
            }
        }

        /* INFOGRAPHIC LOGIC */
        function showInfographic() {
            const modal = document.getElementById("info-modal");
            const modalImg = document.getElementById("info-image");
            const captionText = document.getElementById("caption");

            // Construct path: "Infographic/Phần 1_.png"
            const imgPath = `Infographic/Phần ${currentPartId}_.png`;

            modal.style.display = "block";
            modalImg.src = imgPath;
            // Reset Zoom
            modalImg.classList.remove('zoomed');
            captionText.innerHTML = `Infographic - Tiết ${currentPartId} <br> <span style='font-size:14px; color:#aaa'>(Nhấn vào ảnh để phóng to/thu nhỏ)</span>`;

            // Check if broken image, fallback handling could go here
            modalImg.onerror = function () {
                this.onerror = null; // prevent infinite loop
                this.src = "Infographic/Phần 1_.png"; // fallback to part 1 or placeholder
                captionText.innerHTML = `Infographic (Tiết ${currentPartId} chưa có sãn, hiển thị mặc định) <br> <span style='font-size:14px; color:#aaa'>(Nhấn vào ảnh để phóng to/thu nhỏ)</span>`;
            };
        }

        function closeInfographic() {
            document.getElementById("info-modal").style.display = "none";
        }

        // Close on outside click
        window.onclick = function (event) {
            const modal = document.getElementById("info-modal");
            if (event.target == modal) {
                modal.style.display = "none";
            }
        }

        // Drag to Scroll Logic
        const img = document.getElementById("info-image");
        const modal = document.getElementById("info-modal");
        let isDown = false;
        let startX, startY;
        let scrollLeft, scrollTop;
        let isDragging = false; // Flag to distinguish click from drag

        img.addEventListener('mousedown', (e) => {
            if (!img.classList.contains('zoomed')) return;
            isDown = true;
            isDragging = false; // Reset drag flag
            startX = e.pageX - modal.offsetLeft;
            startY = e.pageY - modal.offsetTop;
            scrollLeft = modal.scrollLeft;
            scrollTop = modal.scrollTop;
            e.preventDefault(); // prevent image drag
        });

        img.addEventListener('mouseleave', () => {
            isDown = false;
        });

        img.addEventListener('mouseup', (e) => {
            isDown = false;
            if (!isDragging) {
                // It was a click, toggle zoom
                e.stopPropagation();
                img.classList.toggle("zoomed");
            }
        });

        img.addEventListener('mousemove', (e) => {
            if (!isDown) return;
            e.preventDefault();
            const x = e.pageX - modal.offsetLeft;
            const y = e.pageY - modal.offsetTop;
            const walkX = (x - startX) * 1.5; // scroll-fast
            const walkY = (y - startY) * 1.5;

            // If moved more than a few pixels, consider it a drag
            if (Math.abs(walkX) > 5 || Math.abs(walkY) > 5) {
                isDragging = true;
            }

            modal.scrollLeft = scrollLeft - walkX;
            modal.scrollTop = scrollTop - walkY;
        });

        document.addEventListener('DOMContentLoaded', () => {
            // Load Default Part (Part 1)
            loadPart(1, document.querySelector('.part-btn.active'));

            // Set Quiz src
            document.getElementById('quiz-frame').src = config.quizCsv;
        });
    </script>
